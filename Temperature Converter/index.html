<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">

    <div class="heading">
    <h1>Temperature Converter</h1>
    </div>

    <div class="input-field">
    <label>Temperature</label>
    <input autocomplete="off" id="temp-input">
    <button id="convert-button">Convert</button>
    </div>

    <div class="selection-field">
    <span id="btn1">
    <label for="ctf" id="option1">Celsius to Fahrenheit</label>
    <input type="radio" name="selection" id="ctf">
    </span>
    <span id="btn2">
    <label for="ftc" id="option2">Fahrenheit to Celsius</label>
    <input type="radio" name="selection" id="ftc">
    </span>
    </div>

    </div>



    <script src="index.js"></script>
</body>
</html>
